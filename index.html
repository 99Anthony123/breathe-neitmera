<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apnoe Trainer</title>
<meta name="description" content="Apnoe breath-hold trainer with phase countdowns.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1721">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/bricolage-grotesque-500.woff2') format('woff2'); }
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 700; font-style: normal; font-display: swap; src: url('fonts/bricolage-grotesque-700.woff2') format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/figtree-400.woff2') format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/figtree-500.woff2') format('woff2'); }
@font-face { font-family: 'Figtree'; font-weight: 600; font-style: normal; font-display: swap; src: url('fonts/figtree-600.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/dm-mono-400.woff2') format('woff2'); }
@font-face { font-family: 'DM Mono'; font-weight: 500; font-style: normal; font-display: swap; src: url('fonts/dm-mono-500.woff2') format('woff2'); }
/* Layout idea: one phone-width column, Train and History tabs at the bottom, a full-screen session view tinted by the current breathing phase. */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --surface2: #e3ebf0;
  --line: #cbd8e0;
  --ink: #0f2230;
  --muted: #53697a;
  --btn: #0f2230;
  --btn-ink: #ffffff;
  --danger: #c43b2c;
  --p-in: #0d9a88;
  --p-hold: #3566d6;
  --p-out: #7f4fd0;
  --p-empty: #b86d12;
  --hr: #d6334a;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-num: 'DM Mono', ui-monospace, 'Roboto Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1721;
    --surface: #12222f;
    --surface2: #1a2f3f;
    --line: #25394a;
    --ink: #e8f0f5;
    --muted: #8ea5b4;
    --btn: #e8f0f5;
    --btn-ink: #0a1721;
    --danger: #ff7a6b;
    --p-in: #3fd2bd;
    --p-hold: #7da2ff;
    --p-out: #b894ff;
    --p-empty: #f0a95b;
    --hr: #ff6b7d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1721;
  --surface: #12222f;
  --surface2: #1a2f3f;
  --line: #25394a;
  --ink: #e8f0f5;
  --muted: #8ea5b4;
  --btn: #e8f0f5;
  --btn-ink: #0a1721;
  --danger: #ff7a6b;
  --p-in: #3fd2bd;
  --p-hold: #7da2ff;
  --p-out: #b894ff;
  --p-empty: #f0a95b;
  --hr: #ff6b7d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 17px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--p-hold); outline-offset: 2px; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
main { flex: 1; overflow-y: auto; padding: 20px 16px 24px; padding-top: max(20px, env(safe-area-inset-top)); }
.view[hidden] { display: none; }

h1 { font: 700 30px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0 0 4px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; }
h2 { font: 700 13px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }

/* Bottom tabs */
nav { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; background: none; border: 0; padding: 12px 8px 10px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-weight: 600; font-size: 14px; min-height: 56px; }
nav button[aria-selected="true"] { color: var(--ink); }
nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Fields */
.field { display: grid; gap: 6px; }
.field > span, .plabel { font-weight: 600; font-size: 14px; color: var(--muted); }
input[type=text], input[type=datetime-local], input[type=number] {
  width: 100%; min-height: 48px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
}
input[type=number] { -moz-appearance: textfield; appearance: textfield; text-align: center; font: 500 20px var(--font-num); padding: 8px 4px; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input:focus { border-color: var(--ink); outline: none; }
#f-name { font: 600 20px var(--font-display); }

.phases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 8px; border-top: 4px solid var(--c); }
.plabel { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 15px; }
.plabel i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.stepper { display: grid; grid-template-columns: 40px 1fr 40px; gap: 6px; align-items: center; }
.stepper button { width: 40px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface2); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.stepper button:active { background: var(--line); }
.unit { font-size: 13px; color: var(--muted); text-align: center; }

.cycle { margin: 16px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cycle b { font: 500 22px var(--font-num); }
.tl { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--surface2); }
.tl span { background: var(--c); min-width: 3px; }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 14px; }
.plan-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.plan-row .stepper { grid-template-columns: 40px 76px 40px; }
.plan-row label { font-weight: 600; }
.plan-row small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.result { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
.result b { font: 500 22px var(--font-num); }
.result .diff { color: var(--muted); font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 6px 0; text-decoration: underline; font-weight: 600; font-size: 15px; min-height: 36px; }

.opts { display: grid; gap: 4px; }
.switch-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-weight: 500; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked + i { background: var(--p-in); }
.switch input:checked + i::after { transform: translateX(22px); }
.switch input:focus-visible + i { outline: 3px solid var(--p-hold); outline-offset: 2px; }
.ready-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-weight: 500; }
.ready-row .stepper { grid-template-columns: 40px 64px 40px; }

.btn { min-height: 56px; border-radius: 16px; border: 0; background: var(--btn); color: var(--btn-ink); font: 700 18px var(--font-display); padding: 0 20px; width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: var(--surface2); color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { min-height: 44px; font-size: 16px; width: auto; border-radius: 12px; }
.startwrap { margin-top: 22px; display: grid; gap: 8px; }
.err { color: var(--danger); font-weight: 600; font-size: 14px; min-height: 1em; margin: 0; }

/* History */
.hhead { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.stats { display: flex; gap: 10px; margin: 14px 0 6px; }
.stat { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font: 500 24px var(--font-num); }
.stat span { font-size: 13px; color: var(--muted); }
.list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-columns: 1fr auto; align-items: stretch; overflow: hidden; }
.row-main { text-align: left; background: none; border: 0; padding: 12px 8px 12px 14px; display: grid; gap: 2px; min-width: 0; }
.row-name { font: 700 18px var(--font-display); overflow-wrap: anywhere; }
.row-date { font-size: 14px; color: var(--muted); }
.row-meta { font-size: 14px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; margin-top: 2px; }
.pat { font-family: var(--font-num); font-weight: 500; }
.pat i { font-style: normal; color: var(--c); }
.pat u { text-decoration: none; color: var(--muted); padding: 0 3px; }
.row-again { border: 0; border-left: 1px solid var(--line); background: var(--surface2); padding: 0 14px; font-weight: 600; font-size: 14px; display: grid; place-items: center; gap: 2px; min-width: 64px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; border: 1.5px dashed var(--line); border-radius: 16px; margin-top: 14px; }

/* Dialog */
#dlg { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center; background: rgba(5, 12, 18, .6); }
#dlg.open { display: flex; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px 16px; padding-bottom: max(20px, env(safe-area-inset-bottom)); display: grid; gap: 14px; }
.sheet h3 { font: 700 24px/1.15 var(--font-display); margin: 0; }
.sheet p { margin: 0; color: var(--muted); }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btnrow { display: grid; gap: 8px; }
.btnrow.two { grid-template-columns: 1fr 1fr; }
.big-stats { display: flex; gap: 10px; }
.big-stats div { flex: 1; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.big-stats b { display: block; font: 500 26px var(--font-num); }
.big-stats span { font-size: 13px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; }

#upd { position: fixed; left: 16px; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); max-width: 528px; margin: 0 auto; z-index: 30; background: var(--btn); color: var(--btn-ink); border-radius: 14px; padding: 8px 8px 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; }
#upd[hidden] { display: none; }
#upd button { min-height: 44px; border-radius: 10px; border: 0; background: var(--btn-ink); color: var(--btn); font-weight: 700; padding: 0 18px; }

/* Heart rate */
.hrcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.hr-note { margin: 0; color: var(--muted); font-size: 15px; }
.hr-live { display: flex; align-items: baseline; gap: 10px; }
.hr-live b { font: 500 40px/1 var(--font-num); }
.hr-live span { color: var(--muted); }
.hr-live .hr-heart { color: var(--hr); font-size: 24px; }
.hrbox { display: grid; gap: 8px; background: var(--surface2); border-radius: 14px; padding: 12px; }
.hrbox h4 { margin: 0; font: 700 13px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hrbox svg { width: 100%; height: auto; display: block; }
.hrbox p { margin: 0; font-size: 14px; color: var(--muted); }
.hrmeta { color: var(--hr); font-weight: 600; }
.s-hr { display: flex; align-items: baseline; gap: 8px; font-weight: 600; color: var(--muted); }
.s-hr[hidden] { display: none; }
.s-hr b { font: 500 34px/1 var(--font-num); color: var(--hr); min-width: 2ch; text-align: right; }
.s-hr .hr-heart { color: var(--hr); }

/* Max hold */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface2); border-radius: 14px; padding: 4px; margin: 14px 0 4px; }
.seg button { min-height: 44px; border: 0; border-radius: 10px; background: none; font-weight: 600; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.chartcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 10px; display: grid; gap: 6px; }
.chartcard svg { width: 100%; height: auto; display: block; }
.chartcard .seg { margin: 4px 0 2px; padding: 3px; border-radius: 12px; }
.chartcard .seg button { min-height: 36px; font-size: 14px; border-radius: 9px; }
.chartcard h4 { margin: 0; font: 700 13px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chartcard p { margin: 0; font-size: 13px; color: var(--muted); }
.row.one { grid-template-columns: 1fr; }
.pb { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 8px; background: color-mix(in srgb, var(--p-empty) 22%, transparent); color: var(--p-empty); font: 700 12px var(--font-body); letter-spacing: .04em; vertical-align: middle; }
.m-big { font: 500 clamp(76px, 25vw, 132px)/1 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; color: var(--phase); }
.m-bar { width: min(80%, 360px); }
.m-bar[hidden] { display: none; }
#mhold .m-bar i { background: var(--phase); }
.s-btns.m-btns { grid-template-columns: 1fr; }
.m-btns .btn { min-height: 72px; font-size: 22px; }
.m-btns .btn.ghost { min-height: 52px; font-size: 17px; }
.m-btns .btn[hidden] { display: none; }

/* Session */
#session, #mhold { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; background: color-mix(in srgb, var(--phase) 17%, var(--bg)); transition: background .5s; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); }
#session.open, #mhold.open { display: flex; }
.s-top { width: 100%; max-width: 560px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.s-name { font: 700 18px var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-round { font: 500 16px var(--font-num); color: var(--muted); white-space: nowrap; }
.s-mid { flex: 1; width: 100%; max-width: 560px; display: grid; place-items: center; align-content: center; gap: 14px; min-height: 0; }
.s-phase { font: 700 clamp(30px, 9vw, 44px)/1 var(--font-display); letter-spacing: -0.02em; color: var(--phase); text-align: center; }
.s-sub { color: var(--muted); font-weight: 500; margin-top: -6px; text-align: center; min-height: 1.4em; }
.cds { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cd { border-radius: 16px; border: 1.5px solid var(--line); background: color-mix(in srgb, var(--c) 7%, var(--surface)); padding: 12px 4px 10px; display: grid; justify-items: center; gap: 8px; transition: opacity .25s, border-color .25s, background .25s; }
.cd span { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--c); text-align: center; line-height: 1.15; min-height: 2.3em; display: grid; align-items: center; }
.rg { position: relative; width: 100%; aspect-ratio: 1; }
.rg svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.rg circle { fill: none; stroke-width: 8; }
.rg .track { stroke: color-mix(in srgb, var(--c) 22%, transparent); }
.rg .prog { stroke: var(--c); stroke-linecap: round; }
.rg b { position: absolute; inset: 0; display: grid; place-items: center; font: 500 clamp(22px, 7.8vw, 36px)/1 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.cd.active { border-color: var(--c); background: color-mix(in srgb, var(--c) 20%, var(--surface)); }
.cd.done { opacity: .55; }
.cd.skip { opacity: .3; }
.s-next { color: var(--muted); font-weight: 500; text-align: center; min-height: 1.4em; }
.s-total { width: 100%; max-width: 560px; display: grid; gap: 8px; margin-bottom: 14px; }
.s-total-row { display: flex; justify-content: space-between; align-items: baseline; }
.s-total-row span { color: var(--muted); font-weight: 600; font-size: 14px; }
.s-total-row b { font: 500 28px var(--font-num); }
.bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }
.s-btns { width: 100%; max-width: 560px; display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
.s-hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 560px; margin: 0 0 10px; min-height: 0; }

@media (max-height: 640px) { .s-mid { gap: 8px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <main>
    <section class="view" id="view-train" aria-labelledby="t-train"></section>
    <section class="view" id="view-max" aria-labelledby="t-max" hidden></section>
    <section class="view" id="view-history" aria-labelledby="t-history" hidden></section>
    <section class="view" id="view-templates" aria-labelledby="t-templates" hidden></section>
  </main>
  <nav aria-label="Main">
    <button type="button" data-tab="train" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      Train
    </button>
    <button type="button" data-tab="max" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4v3.5L12 12l-4 4.5V20M16 4v3.5L12 12l4 4.5V20"/></svg>
      Max hold
    </button>
    <button type="button" data-tab="history" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
      History
    </button>
    <button type="button" data-tab="templates" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg>
      Templates
    </button>
  </nav>
</div>

<div id="session" role="dialog" aria-modal="true" aria-label="Training session">
  <div class="s-top"><span class="s-name" id="s-name"></span><span class="s-round" id="s-round"></span></div>
  <div class="s-mid">
    <div class="s-phase" id="s-phase" aria-live="polite"></div>
    <div class="s-sub" id="s-sub"></div>
    <div class="cds" id="s-cds" role="group" aria-label="Phase countdowns"></div>
    <div class="s-hr" data-hrbox hidden><span class="hr-heart">♥</span><b data-hrv>—</b><span data-hrn>bpm</span></div>
    <div class="s-next" id="s-next"></div>
  </div>
  <p class="s-hint" id="s-hint"></p>
  <div class="s-total">
    <div class="s-total-row"><span>Training left</span><b id="s-total">0:00</b></div>
    <div class="bar"><i id="s-bar"></i></div>
  </div>
  <div class="s-btns">
    <button type="button" class="btn" id="s-pause">Pause</button>
    <button type="button" class="btn ghost" id="s-stop">End</button>
  </div>
</div>

<div id="mhold" role="dialog" aria-modal="true" aria-label="Maximum breath hold">
  <div class="s-top"><span class="s-name">Max hold</span><span class="s-round" id="m-tag"></span></div>
  <div class="s-mid">
    <div class="s-phase" id="m-phase"></div>
    <div class="s-sub" id="m-sub"></div>
    <div class="m-big" id="m-big" role="timer">0:00</div>
    <div class="bar m-bar" id="m-barwrap"><i id="m-bar"></i></div>
    <div class="s-hr" data-hrbox hidden><span class="hr-heart">♥</span><b data-hrv>—</b><span data-hrn>bpm</span></div>
  </div>
  <div class="s-btns m-btns">
    <button type="button" class="btn" id="m-main">Start breath hold</button>
    <button type="button" class="btn ghost" id="m-cancel">Cancel</button>
  </div>
</div>

<div id="dlg" role="presentation"></div>
<div id="upd" role="status" hidden><span>A new version is ready.</span><button type="button" id="upd-btn">Update</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Model ---------- */
const PHASES = [
  { key: 'in',    field: 'inS',    setup: 'Breathe in',  name: 'Breathe in',  sub: 'Lungs filling',  step: 1 },
  { key: 'hold',  field: 'holdS',  setup: 'Hold full',   name: 'Hold',        sub: 'Lungs full',     step: 5 },
  { key: 'out',   field: 'outS',   setup: 'Breathe out', name: 'Breathe out', sub: 'Lungs emptying', step: 1 },
  { key: 'empty', field: 'emptyS', setup: 'Hold empty',  name: 'Hold empty',  sub: 'Lungs empty',    step: 5 },
];
const DEFAULTS = { name: '50 Seconds', inS: 5, holdS: 50, outS: 5, emptyS: 10, targetMin: 15, rounds: 13, roundsManual: false, readyS: 5, sound: true, vibrate: true, relaxS: 120 };
let S = Object.assign({}, DEFAULTS);
let H = [];            // history entries
let T = [];            // templates
let M = [];            // max breath holds
let histMode = 'train';
let chartMode = 'attempt';   // 'attempt' = evenly spaced, 'date' = scaled by real date
try { if (localStorage.getItem('apnoe.chartmode.v1') === 'date') chartMode = 'date'; } catch (e) {}
let touched = false;   // user changed settings this visit

const cycleOf = c => c.inS + c.holdS + c.outS + c.emptyS;
const suggestRounds = c => { const cy = cycleOf(c); return cy > 0 ? Math.max(1, Math.round(c.targetMin * 60 / cy)) : 0; };
function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const num = (el, lo, hi, fb) => { const v = parseInt(el.value, 10); return Number.isFinite(v) ? clamp(v, lo, hi) : fb; };
const patternHtml = e => '<span class="pat">' + PHASES.map(p => `<i style="--c:var(--p-${p.key})">${e[p.field]}</i>`).join('<u>·</u>') + '</span>';

/* ---------- Storage: this phone only (localStorage) ---------- */
const LS_H = 'apnoe.history.v1', LS_S = 'apnoe.settings.v1', LS_T = 'apnoe.templates.v1', LS_M = 'apnoe.maxhold.v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } };
function saveHistory() { lsSet(LS_H, H); }
function saveTemplates() { lsSet(LS_T, T); }
function saveMax() { lsSet(LS_M, M); }
let settingsTimer = null;
function saveSettings(now) {
  clearTimeout(settingsTimer);
  const go = () => lsSet(LS_S, S);
  if (now) go(); else settingsTimer = setTimeout(go, 700);
}

/* ---------- Toast and dialog ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
let dlgClose = null;
function openDialog(html, onMount, onClose) {
  const d = $('#dlg'); d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  d.classList.add('open'); dlgClose = onClose || null;
  if (onMount) onMount(d.firstElementChild);
  const f = d.querySelector('[autofocus]'); if (f) f.focus();
}
function closeDialog() { const d = $('#dlg'); d.classList.remove('open'); d.innerHTML = ''; const c = dlgClose; dlgClose = null; if (c) c(); }
$('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg' && !$('#dlg').dataset.lock) closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#dlg').classList.contains('open') && !$('#dlg').dataset.lock) closeDialog(); });

/* ---------- Train view ---------- */
function buildTrain() {
  const cards = PHASES.map(p => `
    <div class="pcard" style="--c:var(--p-${p.key})">
      <label class="plabel" for="f-${p.field}"><i></i>${p.setup}</label>
      <div class="stepper">
        <button type="button" data-for="f-${p.field}" data-delta="-${p.step}" aria-label="Less ${p.setup}">−</button>
        <input id="f-${p.field}" data-key="${p.field}" type="number" inputmode="numeric" min="0" max="600">
        <button type="button" data-for="f-${p.field}" data-delta="${p.step}" aria-label="More ${p.setup}">+</button>
      </div>
      <span class="unit">seconds</span>
    </div>`).join('');
  $('#view-train').innerHTML = `
    <h1 id="t-train">Apnoe Trainer</h1>
    <p class="sub">Set one breathing cycle, then repeat it.</p>
    <label class="field"><span>Training name</span><input id="f-name" type="text" maxlength="40" autocomplete="off" placeholder="e.g. 50 Seconds"></label>
    <h2>Cycle</h2>
    <div class="phases">${cards}</div>
    <div class="cycle"><span>One cycle</span><b id="cycle-len">0:00</b></div>
    <div class="tl" id="tl" aria-hidden="true"></div>
    <h2>Length</h2>
    <div class="plan">
      <div class="plan-row">
        <label for="f-targetMin">Target length<small>minutes</small></label>
        <div class="stepper">
          <button type="button" data-for="f-targetMin" data-delta="-1" aria-label="Shorter target">−</button>
          <input id="f-targetMin" data-key="targetMin" type="number" inputmode="numeric" min="1" max="180">
          <button type="button" data-for="f-targetMin" data-delta="1" aria-label="Longer target">+</button>
        </div>
      </div>
      <div class="plan-row">
        <label for="f-rounds">Total rounds<small id="sugg-line"></small></label>
        <div class="stepper">
          <button type="button" data-for="f-rounds" data-delta="-1" aria-label="Fewer rounds">−</button>
          <input id="f-rounds" data-key="rounds" type="number" inputmode="numeric" min="1" max="500">
          <button type="button" data-for="f-rounds" data-delta="1" aria-label="More rounds">+</button>
        </div>
      </div>
      <button type="button" class="linkbtn" id="use-sugg" hidden></button>
      <div class="result"><span>Total training time</span><b id="total-len">0:00</b><span class="diff" id="diff-line"></span></div>
    </div>
    <h2>Heart rate</h2>
    <div class="hrcard hr-card"></div>
    <h2>Options</h2>
    <div class="opts">
      <div class="ready-row"><label for="f-readyS">Get ready before start (seconds)</label>
        <div class="stepper">
          <button type="button" data-for="f-readyS" data-delta="-5" aria-label="Shorter get-ready time">−</button>
          <input id="f-readyS" data-key="readyS" type="number" inputmode="numeric" min="0" max="60">
          <button type="button" data-for="f-readyS" data-delta="5" aria-label="Longer get-ready time">+</button>
        </div>
      </div>
      <div class="switch-row"><label for="f-sound">Sound cues</label><span class="switch"><input id="f-sound" data-key="sound" type="checkbox"><i></i></span></div>
      <div class="switch-row"><label for="f-vibrate">Vibration</label><span class="switch"><input id="f-vibrate" data-key="vibrate" type="checkbox"><i></i></span></div>
    </div>
    <div class="startwrap">
      <p class="err" id="start-err" role="alert"></p>
      <button type="button" class="btn" id="start">Start training</button>
      <button type="button" class="btn ghost" id="save-tpl">Save as template</button>
    </div>`;
}
function syncFields() {
  $('#f-name').value = S.name;
  for (const k of ['inS', 'holdS', 'outS', 'emptyS', 'targetMin', 'readyS']) $('#f-' + k).value = S[k];
  $('#f-sound').checked = !!S.sound; $('#f-vibrate').checked = !!S.vibrate;
  recompute(true);
}
function recompute(writeRounds) {
  const cy = cycleOf(S), sg = suggestRounds(S);
  if (!S.roundsManual && sg) S.rounds = sg;
  if (writeRounds || !S.roundsManual) $('#f-rounds').value = S.rounds;
  $('#cycle-len').textContent = fmt(cy);
  $('#tl').innerHTML = cy > 0 ? PHASES.filter(p => S[p.field] > 0).map(p => `<span style="flex:${S[p.field]};--c:var(--p-${p.key});background:var(--c)"></span>`).join('') : '';
  const total = S.rounds * cy;
  $('#total-len').textContent = fmt(total);
  const d = total - S.targetMin * 60;
  $('#diff-line').textContent = cy > 0 ? (d === 0 ? 'Exactly on target' : `${d > 0 ? '+' : '−'}${fmt(Math.abs(d))} vs ${S.targetMin} min target`) : '';
  $('#sugg-line').textContent = sg ? `Suggested: ${sg}` : '';
  const us = $('#use-sugg');
  us.hidden = !(S.roundsManual && sg && S.rounds !== sg);
  us.textContent = `Use suggested ${sg} rounds (${fmt(sg * cy)})`;
  const btn = $('#start');
  btn.disabled = cy <= 0;
  btn.textContent = cy > 0 ? `Start · ${S.rounds} rounds · ${fmt(total)}` : 'Start training';
  $('#start-err').textContent = cy > 0 ? '' : 'Set at least one phase above 0 seconds.';
}
function bindTrain() {
  const v = $('#view-train');
  v.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.for) {
      const el = $('#' + b.dataset.for);
      const cur = parseInt(el.value, 10) || 0;
      const next = clamp(cur + parseInt(b.dataset.delta, 10), +el.min, +el.max);
      el.value = next; el.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (b.id === 'use-sugg') {
      S.roundsManual = false; touched = true; recompute(true); saveSettings();
    } else if (b.id === 'start') startSession();
    else if (b.id === 'save-tpl') openTemplateEditor(null, S);

  });
  v.addEventListener('input', e => {
    const el = e.target; touched = true;
    if (el.id === 'f-name') S.name = el.value;
    else if (el.dataset.key === 'rounds') { S.rounds = num(el, 1, 500, S.rounds); S.roundsManual = S.rounds !== suggestRounds(S); }
    else if (el.type === 'checkbox') S[el.dataset.key] = el.checked;
    else if (el.dataset.key) {
      const lim = { targetMin: [1, 180], readyS: [0, 60] }[el.dataset.key] || [0, 600];
      S[el.dataset.key] = num(el, lim[0], lim[1], el.dataset.key === 'targetMin' ? 1 : 0);
    }
    recompute(false); saveSettings();
  });
  v.addEventListener('change', e => {   // tidy up values when a field loses focus
    const el = e.target;
    if (el.type === 'number' && el.dataset.key) el.value = S[el.dataset.key];
  });
}

/* ---------- History view ---------- */
function renderHistory() {
  const items = H.slice().sort((a, b) => b.ts - a.ts);
  const totalRounds = items.reduce((n, e) => n + e.rounds, 0);
  const totalSec = items.reduce((n, e) => n + e.rounds * cycleOf(e), 0);
  const rows = items.map(e => {
    const when = new Date(e.ts).toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const rd = e.planned && e.planned !== e.rounds ? `${e.rounds} of ${e.planned} rounds` : `${e.rounds} round${e.rounds === 1 ? '' : 's'}`;
    return `<li class="row">
      <button type="button" class="row-main" data-act="edit" data-id="${esc(e.id)}" aria-label="Edit ${esc(e.name)}">
        <span class="row-name">${esc(e.name)}</span>
        <span class="row-date">${esc(when)}</span>
        <span class="row-meta">${patternHtml(e)}<span>${rd}</span><span>${fmt(e.rounds * cycleOf(e))}</span>${e.hr ? `<span class="hrmeta">♥ ${e.hr.avg} avg · ${e.hr.max} max</span>` : ''}</span>
      </button>
      <button type="button" class="row-again" data-act="again" data-id="${esc(e.id)}" aria-label="Train again with ${esc(e.name)}">Train<br>again</button>
    </li>`;
  }).join('');
  const trainHtml = `
    <div class="stats">
      <div class="stat"><b>${items.length}</b><span>Trainings</span></div>
      <div class="stat"><b>${totalRounds}</b><span>Rounds</span></div>
      <div class="stat"><b>${fmt(totalSec)}</b><span>Total time</span></div>
    </div>
    ${items.length ? `<ul class="list">${rows}</ul>` : '<div class="empty">No trainings saved yet.<br>Finish a training and choose Save, or tap Add to enter one by hand.</div>'}`;
  $('#view-history').innerHTML = `
    <div class="hhead"><div><h1 id="t-history">History</h1></div>
      <button type="button" class="btn small" data-act="add">Add</button></div>
    <div class="seg" role="group" aria-label="History type">
      <button type="button" data-act="mode" data-mode="train" aria-selected="${histMode === 'train'}">Training</button>
      <button type="button" data-act="mode" data-mode="max" aria-selected="${histMode === 'max'}">Max hold</button>
    </div>
    ${histMode === 'max' ? maxHistoryHtml() : trainHtml}
    <h2>Backup</h2>
    <p class="sub" style="margin:0 0 10px">Your history, templates and max holds are stored on this phone only. Save a copy now and then, for example before clearing browser data.</p>
    <div class="btnrow two"><button type="button" class="btn ghost small" data-act="export">Save backup</button><button type="button" class="btn ghost small" data-act="import">Restore backup</button></div>
    <input type="file" id="imp" accept="application/json,.json" hidden>`;
}
$('#view-history').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'mode') { histMode = b.dataset.mode; renderHistory(); }
  else if (act === 'chart') { chartMode = b.dataset.cm === 'date' ? 'date' : 'attempt'; try { localStorage.setItem('apnoe.chartmode.v1', chartMode); } catch (e) {} renderHistory(); }
  else if (act === 'add') (histMode === 'max' ? openMaxEditor(null) : openEditor(null));
  else if (act === 'edit-max') openMaxEditor(M.find(x => x.id === id));
  else if (act === 'export') exportBackup();
  else if (act === 'import') $('#imp').click();
  else if (act === 'edit') openEditor(H.find(x => x.id === id));
  else if (act === 'again') {
    const x = H.find(h => h.id === id); if (!x) return;
    Object.assign(S, { name: x.name, inS: x.inS, holdS: x.holdS, outS: x.outS, emptyS: x.emptyS, roundsManual: false });
    touched = true; syncFields(); saveSettings(true); showTab('train'); toast(`Loaded “${x.name}”`);
  }
});
function exportBackup() {
  try {
    const blob = new Blob([JSON.stringify({ app: 'apnoe-trainer', version: 4, history: H, templates: T, maxhold: M }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `apnoe-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Backup saved to your downloads');
  } catch (e) { toast('Could not create the backup'); }
}
function cleanMax(x) {
  if (!x || typeof x !== 'object') return null;
  const n = (v, hi) => clamp(Math.round(Number(v)) || 0, 0, hi);
  const e = { id: String(x.id || '').slice(0, 40), ts: Number(x.ts), holdS: n(x.holdS, 7200), relaxS: n(x.relaxS, 7200) };
  if (x.hr && Array.isArray(x.hr.v)) { const hs = hrSummary(x.hr.v.slice(0, 20000).map(a => n(a, 250))); if (hs) e.hr = hs; }
  if (Number(x.restHr) > 0) e.restHr = n(x.restHr, 250);
  return e.id && Number.isFinite(e.ts) && e.holdS > 0 ? e : null;
}
function cleanEntry(x) {
  if (!x || typeof x !== 'object') return null;
  const n = (v, hi) => clamp(Math.round(Number(v)) || 0, 0, hi);
  const e = { id: String(x.id || '').slice(0, 40), name: String(x.name || 'Training').slice(0, 40), ts: Number(x.ts),
    inS: n(x.inS, 600), holdS: n(x.holdS, 600), outS: n(x.outS, 600), emptyS: n(x.emptyS, 600), rounds: n(x.rounds, 500) };
  e.planned = Math.max(e.rounds, n(x.planned, 500));
  if (x.hr && Array.isArray(x.hr.v)) { const hs = hrSummary(x.hr.v.slice(0, 20000).map(a => n(a, 250))); if (hs) e.hr = hs; }
  return e.id && Number.isFinite(e.ts) && cycleOf(e) > 0 ? e : null;
}
$('#view-history').addEventListener('change', ev => {
  if (ev.target.id !== 'imp' || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const list = (Array.isArray(data) ? data : data.history || []).map(cleanEntry).filter(Boolean);
      const have = new Set(H.map(h => h.id));
      const fresh = list.filter(e => !have.has(e.id));
      H = H.concat(fresh); saveHistory(); renderHistory();
      const haveT = new Set(T.map(t => t.id));
      const freshT = (Array.isArray(data.templates) ? data.templates : []).map(cleanTemplate).filter(t => t && !haveT.has(t.id));
      T = T.concat(freshT); saveTemplates(); renderTemplates();
      const haveM = new Set(M.map(m => m.id));
      const freshM = (Array.isArray(data.maxhold) ? data.maxhold : []).map(cleanMax).filter(m => m && !haveM.has(m.id));
      M = M.concat(freshM); saveMax(); renderHistory();
      const parts = [];
      if (fresh.length) parts.push(`${fresh.length} training${fresh.length === 1 ? '' : 's'}`);
      if (freshT.length) parts.push(`${freshT.length} template${freshT.length === 1 ? '' : 's'}`);
      if (freshM.length) parts.push(`${freshM.length} max hold${freshM.length === 1 ? '' : 's'}`);
      toast(parts.length ? `Restored ${parts.join(' and ')}` : 'Nothing new to restore');
    } catch (e) { toast('That file is not a valid backup'); }
  };
  r.readAsText(ev.target.files[0]); ev.target.value = '';
});
/* ---------- Templates ---------- */
function cleanTemplate(x) {
  if (!x || typeof x !== 'object') return null;
  const n = (v, lo, hi) => clamp(Math.round(Number(v)) || 0, lo, hi);
  const t = { id: String(x.id || '').slice(0, 40), name: String(x.name || 'Template').slice(0, 40),
    inS: n(x.inS, 0, 600), holdS: n(x.holdS, 0, 600), outS: n(x.outS, 0, 600), emptyS: n(x.emptyS, 0, 600), targetMin: n(x.targetMin || 15, 1, 180) };
  return t.id && cycleOf(t) > 0 ? t : null;
}
function renderTemplates() {
  const rows = T.map(t => `<li class="row">
      <button type="button" class="row-main" data-act="use" data-id="${esc(t.id)}" aria-label="Load ${esc(t.name)} into Train">
        <span class="row-name">${esc(t.name)}</span>
        <span class="row-meta">${patternHtml(t)}<span>Cycle ${fmt(cycleOf(t))}</span><span>${t.targetMin} min</span></span>
      </button>
      <button type="button" class="row-again" data-act="edit" data-id="${esc(t.id)}" aria-label="Edit ${esc(t.name)}">Edit</button>
    </li>`).join('');
  $('#view-templates').innerHTML = `
    <div class="hhead"><div><h1 id="t-templates">Templates</h1><p class="sub" style="margin:0">Tap one to load it into Train.</p></div>
      <button type="button" class="btn small" data-act="new">New</button></div>
    ${T.length ? `<ul class="list">${rows}</ul>` : '<div class="empty">No templates yet.<br>Tap New, or set up a cycle on the Train tab and choose Save as template.</div>'}`;
}
$('#view-templates').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const t = T.find(x => x.id === b.dataset.id);
  if (b.dataset.act === 'new') openTemplateEditor(null, Object.assign({}, DEFAULTS, { name: '' }));
  else if (b.dataset.act === 'edit' && t) openTemplateEditor(t);
  else if (b.dataset.act === 'use' && t) {
    Object.assign(S, { name: t.name, inS: t.inS, holdS: t.holdS, outS: t.outS, emptyS: t.emptyS, targetMin: t.targetMin, roundsManual: false });
    touched = true; syncFields(); saveSettings(true); showTab('train'); toast(`Loaded “${t.name}”`);
  }
});
function openTemplateEditor(tpl, base) {
  const isNew = !tpl;
  const e = tpl || { id: '', name: base.name, inS: base.inS, holdS: base.holdS, outS: base.outS, emptyS: base.emptyS, targetMin: base.targetMin };
  const f = PHASES.map(p => `<label class="field"><span>${p.setup} (s)</span><input id="e-${p.field}" type="number" inputmode="numeric" min="0" max="600" value="${e[p.field]}"></label>`).join('');
  openDialog(`
    <h3>${isNew ? 'New template' : 'Edit template'}</h3>
    <label class="field"><span>Name</span><input id="e-name" type="text" maxlength="40" value="${esc(e.name)}" placeholder="e.g. 50 Seconds"></label>
    <div class="grid4">${f}</div>
    <label class="field"><span>Target length (minutes)</span><input id="e-targetMin" type="number" inputmode="numeric" min="1" max="180" value="${e.targetMin}"></label>
    <p id="e-info"></p>
    <p class="err" id="e-err" role="alert"></p>
    <div class="btnrow" id="e-btns">
      <button type="button" class="btn" id="e-save">${isNew ? 'Save template' : 'Save changes'}</button>
      <div class="btnrow two"><button type="button" class="btn ghost" id="e-cancel">Cancel</button>${isNew ? '' : '<button type="button" class="btn ghost" id="e-del">Delete</button>'}</div>
    </div>`, root => {
    const read = () => { const v = (k, lo, hi, fb) => num($('#e-' + k, root), lo, hi, fb);
      return { inS: v('inS', 0, 600, 0), holdS: v('holdS', 0, 600, 0), outS: v('outS', 0, 600, 0), emptyS: v('emptyS', 0, 600, 0), targetMin: v('targetMin', 1, 180, 15) }; };
    const info = () => { const c = read(), cy = cycleOf(c), r = suggestRounds(c);
      $('#e-info', root).textContent = cy > 0 ? `Cycle ${fmt(cy)} · ${r} rounds ≈ ${fmt(r * cy)}` : ''; };

      if ((p.key === 'hold' || p.key === 'empty') && d > 0 && t < n - 1) {
        const x0 = X(t), x1 = X(Math.min(t + d, n - 1));
        bands += `<rect x="${x0.toFixed(1)}" y="${T0}" width="${Math.max(0.5, x1 - x0).toFixed(1)}" height="${Ht - T0 - B}" style="fill:var(--p-${p.key});opacity:.2"/>`;
      }
      t += d;
    }
  }
  let d = '', pen = false;
  v.forEach((x, i) => { if (x > 0) { d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1); pen = true; } else pen = false; });
  const mid = (lo + hi) / 2;
  const grid = [lo, mid, hi].map(g => `<line x1="${L}" x2="${W - R}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" style="stroke:var(--line)"/><text x="${L - 5}" y="${(Y(g) + 3).toFixed(1)}" text-anchor="end" style="fill:var(--muted);font-size:10px">${Math.round(g)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Heart rate during the training">${bands}${grid}
    <path d="${d}" style="fill:none;stroke:var(--hr);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round"/>
    <text x="${L}" y="${Ht - 5}" style="fill:var(--muted);font-size:10px">0:00</text>
    <text x="${W - R}" y="${Ht - 5}" text-anchor="end" style="fill:var(--muted);font-size:10px">${fmt(n)}</text></svg>`;
}

/* ---------- Session ---------- */
let sess = null;
const cdEls = [];
function buildCountdowns() {
  $('#s-cds').innerHTML = PHASES.map((p, i) => `<div class="cd" id="cd${i}" style="--c:var(--p-${p.key})"><span>${p.name}</span><div class="rg"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="prog" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46"/></svg><b>0</b></div></div>`).join('');
  PHASES.forEach((p, i) => { const el = $('#cd' + i); cdEls[i] = { el, b: $('b', el), ring: $('.prog', el) }; });
}
// cur: index of the active phase (or -1 before the training starts); sec: seconds left in it; fill: 0..1 progress of the active phase
function setCountdowns(cur, sec, fill) {
  PHASES.forEach((p, i) => {
    const full = sess.cfg[p.field], c = cdEls[i];
    let val, cls, frac;
    if (full <= 0) { val = 0; cls = 'skip'; frac = 0; }
    else if (cur < 0) { val = full; cls = ''; frac = 0; }
    else if (i < cur) { val = 0; cls = 'done'; frac = 1; }
    else if (i === cur) { val = sec; cls = 'active'; frac = fill; }
    else { val = full; cls = ''; frac = 0; }
    c.b.textContent = val;
    const name = 'cd ' + cls;
    if (c.el.className !== name) c.el.className = name;
    c.ring.style.strokeDashoffset = (276.46 * (1 - frac)).toFixed(2);
  });
}
function startSession() {
  if (cycleOf(S) <= 0) return;
  saveSettings(true);
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!actx && AC) actx = new AC(); if (actx && actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  const seq = PHASES.map((p, i) => ({ p, i, dur: S[p.field] * 1000 })).filter(x => x.dur > 0);
  const cycleMs = seq.reduce((n, x) => n + x.dur, 0);
  sess = { cfg: Object.assign({}, S), seq, cycleMs, rounds: S.rounds, totalMs: cycleMs * S.rounds, readyMs: S.readyS * 1000,
    pos: 0, last: performance.now(), running: true, key: null, tickKey: null, startedAt: Date.now(), timer: null, ended: false, hr: [], hrUi: 0 };
  $('#s-name').textContent = S.name || 'Training';
  $('#session').classList.add('open');
  $('#s-pause').textContent = 'Pause';
  buildCountdowns();
  lockScreen();
  sess.timer = setInterval(tick, 60);
  tick();
}
function setPhaseColor(v) { $('#session').style.setProperty('--phase', v); }
function tick() {
  if (!sess || sess.ended) return;
  const now = performance.now();
  if (sess.running) sess.pos += now - sess.last;
  sess.last = now;
  const s = sess;
  if (now - s.hrUi > 500) { s.hrUi = now; HR.hit(); }
  if (s.pos < s.readyMs) {
    const rem = s.readyMs - s.pos, sec = Math.ceil(rem / 1000);
    setPhaseColor('var(--ink)');
    $('#s-phase').textContent = 'Get ready';
    $('#s-sub').textContent = `Starting in ${sec} s`; setCountdowns(-1, 0, 0);
    $('#s-round').textContent = `${s.rounds} rounds`; $('#s-next').textContent = `Starts with ${s.seq[0].p.name.toLowerCase()}`;
    $('#s-total').textContent = fmt(Math.ceil(s.totalMs / 1000)); $('#s-bar').style.width = '0%';
    if (sec <= 3 && s.tickKey !== 'r' + sec) { s.tickKey = 'r' + sec; beep(1000, .07, 0, .2); }
    return;
  }
  const tp = s.pos - s.readyMs;
  if (tp >= s.totalMs) { finishSession(true); return; }
  const round = Math.floor(tp / s.cycleMs);
  for (let i = s.hr.length; i <= Math.floor(tp / 1000); i++) s.hr.push(HR.value());   // one heart-rate value per training second
  let within = tp - round * s.cycleMs, si = 0;
  while (si < s.seq.length - 1 && within >= s.seq[si].dur) { within -= s.seq[si].dur; si++; }
  const seg = s.seq[si], remMs = seg.dur - within, sec = Math.ceil(remMs / 1000);
  const key = round * 10 + si;
  if (key !== s.key) { s.key = key; cue(seg.p.key); }
  if (sec <= 3 && remMs > 0 && s.tickKey !== key + ':' + sec) { s.tickKey = key + ':' + sec; if (!(seg.dur <= 3000 && within < 300)) beep(1000, .07, 0, .2); }
  setPhaseColor(`var(--p-${seg.p.key})`);
  $('#s-phase').textContent = seg.p.name;
  $('#s-sub').textContent = s.running ? seg.p.sub : 'Paused';
  setCountdowns(seg.i, sec, within / seg.dur);
  $('#s-round').textContent = `Round ${round + 1} of ${s.rounds}`;
  const nxt = si + 1 < s.seq.length ? s.seq[si + 1] : (round + 1 < s.rounds ? s.seq[0] : null);
  $('#s-next').textContent = nxt ? `Next: ${nxt.p.name} · ${Math.round(nxt.dur / 1000)} s` : 'Last phase';
  $('#s-total').textContent = fmt(Math.ceil((s.totalMs - tp) / 1000));
  $('#s-bar').style.width = (tp / s.totalMs * 100).toFixed(2) + '%';
}
$('#s-pause').addEventListener('click', () => {
  if (!sess || sess.ended) return;
  sess.running = !sess.running; sess.last = performance.now();
  $('#s-pause').textContent = sess.running ? 'Pause' : 'Resume';
  if (sess.running) { if (actx && actx.state === 'suspended') actx.resume(); lockScreen(); }
  tick();
});
$('#s-stop').addEventListener('click', () => {
  if (!sess || sess.ended) return;
  const wasRunning = sess.running;
  sess.running = false; sess.last = performance.now();
  const done = completedRounds();
  $('#dlg').dataset.lock = '1';
  openDialog(`<h3>End this training?</h3><p>${done} of ${sess.rounds} rounds completed so far.</p>
    <div class="btnrow"><button type="button" class="btn" id="k-go" autofocus>Keep training</button><button type="button" class="btn ghost" id="k-end">End training</button></div>`, root => {
    $('#k-go', root).onclick = () => { delete $('#dlg').dataset.lock; closeDialog(); if (wasRunning) { sess.running = true; sess.last = performance.now(); } tick(); };
    $('#k-end', root).onclick = () => { delete $('#dlg').dataset.lock; closeDialog(); finishSession(false); };
  });
});
function completedRounds() {
  if (!sess) return 0;
  const tp = Math.max(0, sess.pos - sess.readyMs);
  return Math.min(sess.rounds, Math.floor(tp / sess.cycleMs));
}
function closeSession() {
  if (sess) { clearInterval(sess.timer); sess.ended = true; }
  sess = null; unlockScreen();
  $('#session').classList.remove('open');
}
function finishSession(complete) {
  if (!sess || sess.ended) return;
  const s = sess;
  const done = complete ? s.rounds : completedRounds();
  if (complete) for (let i = s.hr.length; i < Math.round(s.totalMs / 1000); i++) s.hr.push(HR.value());
  s.ended = true; s.running = false; clearInterval(s.timer); unlockScreen();
  if (complete) {
    cue('done'); setPhaseColor('var(--p-in)');
    $('#s-phase').textContent = 'Done'; $('#s-sub').textContent = ''; setCountdowns(99, 0, 0);
    $('#s-total').textContent = '0:00'; $('#s-bar').style.width = '100%'; $('#s-next').textContent = '';
  }
  if (done < 1) {
    closeSession(); toast('No full round finished, nothing to save'); return;
  }
  $('#dlg').dataset.lock = '1';
  const entry = { id: 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: (s.cfg.name || '').trim() || 'Training', ts: s.startedAt,
    inS: s.cfg.inS, holdS: s.cfg.holdS, outS: s.cfg.outS, emptyS: s.cfg.emptyS, rounds: done, planned: s.rounds };
  const hs = hrSummary(s.hr); if (hs) entry.hr = hs;
  openDialog(`<h3>${complete ? 'Training complete' : 'Training ended'}</h3>
    <p>${esc(entry.name)} · ${patternHtml(entry)}</p>
    <div class="big-stats"><div><b>${done}/${s.rounds}</b><span>Rounds</span></div><div><b>${fmt(done * s.cycleMs / 1000)}</b><span>Time</span></div></div>
    ${hs ? `<div class="big-stats"><div><b style="color:var(--hr)">${hs.avg}</b><span>Avg heart rate</span></div><div><b style="color:var(--hr)">${hs.max}</b><span>Max heart rate</span></div></div>` : ''}
    <p style="color:var(--ink);font-weight:600">Save this training to your history?</p>
    <div class="btnrow"><button type="button" class="btn" id="v-save" autofocus>Save to history</button><button type="button" class="btn ghost" id="v-skip">Don’t save</button></div>`, root => {
    $('#v-save', root).onclick = () => { delete $('#dlg').dataset.lock; H.push(entry); saveHistory(); renderHistory(); closeDialog(); closeSession(); showTab('history'); toast('Saved to history'); };
    $('#v-skip', root).onclick = () => { delete $('#dlg').dataset.lock; closeDialog(); closeSession(); showTab('train'); };
  });
}

/* ---------- Max hold: setup view and session ---------- */
function buildMax() {
  $('#view-max').innerHTML = `
    <h1 id="t-max">Max hold</h1>
    <p class="sub">Relax first, then hold your breath as long as you can.</p>
    <h2>Relaxation</h2>
    <div class="plan">
      <div class="plan-row">
        <label for="f-relaxS">Relaxation countdown<small>seconds. Set 0 to start the hold yourself with a button.</small></label>
        <div class="stepper">
          <button type="button" data-for="f-relaxS" data-delta="-15" aria-label="Shorter relaxation">−</button>
          <input id="f-relaxS" type="number" inputmode="numeric" min="0" max="1800">
          <button type="button" data-for="f-relaxS" data-delta="15" aria-label="Longer relaxation">+</button>
        </div>
      </div>
      <div class="result"><span>Relaxation</span><b id="relax-len">2:00</b></div>
    </div>
    <h2>Heart rate</h2>
    <div class="hrcard hr-card"></div>
    <div class="startwrap"><button type="button" class="btn" id="m-start">Start relaxation</button></div>`;
  const v = $('#view-max');
  v.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.for) {
      const el = $('#' + b.dataset.for);
      el.value = clamp((parseInt(el.value, 10) || 0) + parseInt(b.dataset.delta, 10), +el.min, +el.max);
      el.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (b.id === 'm-start') startMax();
  });
  v.addEventListener('input', e => {
    if (e.target.id !== 'f-relaxS') return;
    S.relaxS = num(e.target, 0, 1800, 0); touched = true; syncMax(); saveSettings();
  });
  v.addEventListener('change', e => { if (e.target.id === 'f-relaxS') e.target.value = S.relaxS; });
}
function syncMax() {
  const el = $('#f-relaxS'); if (el && document.activeElement !== el) el.value = S.relaxS;
  $('#relax-len').textContent = S.relaxS > 0 ? fmt(S.relaxS) : 'No countdown';
  $('#m-start').textContent = S.relaxS > 0 ? 'Start relaxation' : 'Start (you press the hold button)';
}
let mh = null;
function startMax() {
  saveSettings(true);
  try { const AC = window.AudioContext || window.webkitAudioContext; if (!actx && AC) actx = new AC(); if (actx && actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  mh = { phase: 'relax', relaxMs: S.relaxS * 1000, t0: performance.now(), holdStart: 0, holdAt: 0, hrRelax: [], hrHold: [], tickKey: null, uiAt: 0, timer: null };
  $('#mhold').classList.add('open');
  lockScreen(); mSetUi();
  mh.timer = setInterval(mTick, 100); mTick();
}
function mSetUi() {
  const m = mh, hold = m.phase === 'hold';
  $('#mhold').style.setProperty('--phase', hold ? 'var(--p-hold)' : 'var(--p-in)');
  $('#m-phase').textContent = hold ? 'Hold' : 'Relax';
  $('#m-tag').textContent = hold ? 'Holding' : (m.relaxMs > 0 ? 'Countdown' : 'Your pace');
  $('#m-sub').textContent = hold ? 'As long as you can. Tap End hold when you breathe.' : (m.relaxMs > 0 ? 'Breathe calmly. The hold starts when the countdown ends.' : 'Breathe calmly. Tap the button when you are ready.');
  $('#m-main').textContent = hold ? 'End hold' : (m.relaxMs > 0 ? 'Start hold now' : 'Start breath hold');
  $('#m-cancel').hidden = hold;
  $('#m-barwrap').hidden = hold || m.relaxMs <= 0;
}
function mTick() {
  const m = mh; if (!m) return;
  const now = performance.now();
  if (m.phase === 'relax') {
    const el = now - m.t0;
    for (let i = m.hrRelax.length; i <= Math.floor(el / 1000); i++) m.hrRelax.push(HR.value());
    if (m.relaxMs > 0) {
      const rem = m.relaxMs - el;
      if (rem <= 0) { mStartHold(); return; }
      const sec = Math.ceil(rem / 1000);
      $('#m-big').textContent = fmt(sec); $('#m-bar').style.width = (el / m.relaxMs * 100).toFixed(1) + '%';
      if (sec <= 3 && m.tickKey !== 'r' + sec) { m.tickKey = 'r' + sec; beep(1000, .07, 0, .2); }
    } else $('#m-big').textContent = fmt(Math.floor(el / 1000));
  } else {
    const hn = now - m.holdStart;
    for (let i = m.hrHold.length; i <= Math.floor(hn / 1000); i++) m.hrHold.push(HR.value());
    $('#m-big').textContent = fmt(Math.floor(hn / 1000));
  }
  if (now - m.uiAt > 500) { m.uiAt = now; HR.hit(); }
}
function mStartHold() {
  const m = mh; if (!m || m.phase === 'hold') return;
  m.phase = 'hold'; m.holdStart = performance.now(); m.holdAt = Date.now();
  cue('hold'); mSetUi(); $('#m-big').textContent = '0:00';
}
function closeMax() {
  if (mh) clearInterval(mh.timer);
  mh = null; unlockScreen(); $('#mhold').classList.remove('open');
}
function mEndHold() {
  const m = mh; if (!m || m.phase !== 'hold') return;
  const ms = performance.now() - m.holdStart;
  clearInterval(m.timer); unlockScreen();
  const holdS = Math.round(ms / 1000);
  const entry = { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: m.holdAt, holdS, relaxS: Math.round((m.holdStart - m.t0) / 1000) };
  const hs = hrSummary(m.hrHold); if (hs) entry.hr = hs;
  const rest = m.hrRelax.slice(-20).filter(x => x > 0);
  if (rest.length >= 3) entry.restHr = Math.round(rest.reduce((a, b) => a + b, 0) / rest.length);
  if (holdS < 1) { closeMax(); toast('Hold too short, nothing to save'); return; }
  beep(523, .2); vibrate(150);
  const prevBest = M.reduce((a, x) => Math.max(a, x.holdS), 0);
  const tiles = [];
  if (entry.restHr) tiles.push(['Resting', entry.restHr]);
  if (hs) { tiles.push(['Average', hs.avg]); tiles.push(['Peak', hs.max]); }
  $('#dlg').dataset.lock = '1';
  openDialog(`<h3>Hold finished</h3>
    <div class="big-stats"><div><b>${fmt(holdS)}</b><span>Hold time</span></div></div>
    ${M.length && holdS > prevBest ? '<p style="color:var(--p-empty);font-weight:700">New personal best!</p>' : ''}
    ${tiles.length ? `<div class="big-stats">${tiles.map(t => `<div><b style="color:var(--hr)">${t[1]}</b><span>${t[0]} heart rate</span></div>`).join('')}</div>` : ''}
    <p style="color:var(--ink);font-weight:600">Save this max hold to your history?</p>
    <div class="btnrow"><button type="button" class="btn" id="v-save" autofocus>Save to history</button><button type="button" class="btn ghost" id="v-skip">Don’t save</button></div>`, root => {
    $('#v-save', root).onclick = () => { delete $('#dlg').dataset.lock; M.push(entry); saveMax(); histMode = 'max'; renderHistory(); closeDialog(); closeMax(); showTab('history'); toast('Saved to history'); };
    $('#v-skip', root).onclick = () => { delete $('#dlg').dataset.lock; closeDialog(); closeMax(); showTab('max'); };
  });
}
$('#m-main').addEventListener('click', () => { if (!mh) return; if (mh.phase === 'hold') mEndHold(); else mStartHold(); });
$('#m-cancel').addEventListener('click', closeMax);

/* ---------- Offline support and updates ---------- */
function setupOffline() {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  let updating = false;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { $('#upd').hidden = false; $('#upd-btn').onclick = () => { updating = true; w.postMessage('SKIP_WAITING'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (updating) location.reload(); });
}

/* ---------- Boot ---------- */
buildTrain(); bindTrain(); buildMax();
const savedS = lsGet(LS_S); if (savedS && typeof savedS === 'object') S = Object.assign({}, DEFAULTS, savedS);
const savedH = lsGet(LS_H); if (Array.isArray(savedH)) H = savedH;
const savedM = lsGet(LS_M); if (Array.isArray(savedM)) M = savedM.map(cleanMax).filter(Boolean);
const savedT = lsGet(LS_T); if (Array.isArray(savedT)) T = savedT.map(cleanTemplate).filter(Boolean);
syncFields(); syncMax(); renderHistory(); renderTemplates(); HR.ui(); setupOffline();
})();
</script>
